<div class="document-entry">
  <a class="document-link" href="{{ .Get "path" | relURL }}">
    <svg class="document-icon" width="16" height="18" viewBox="0 0 16 18" fill="none" aria-hidden="true"><path d="M3 1.5h6l4 4v11H3zM9 1.5v4h4M5.5 9h5M5.5 12h5" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
    <span>{{ .Get "label" }}</span><span class="file-kind">PDF</span>
  </a>
  {{ with .Get "meta" }}<p class="document-meta">{{ . }}</p>{{ end }}
</div>
